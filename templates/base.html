<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}{{ profile.name }}</title>
    <meta name="description" content="{{ profile.name }}（{{ profile.name_en }}）のホームページ。{{ profile.affiliation }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Sans+Coptic&family=Shippori+Mincho:wght@500;600&display=swap">
    <link rel="stylesheet" href="/style.css">
    <meta name="theme-color" content="#050a17">
    <script src="/sky.js" defer></script>
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <div class="band">
        <header class="site-header wrap">
            <a href="{{ url_for('home') }}" class="site-title">{{ profile.name_en }}</a>
            <nav class="global-nav" aria-label="サイト内">
                {% for key, label in [('home', 'ホーム'), ('resume', '経歴'), ('activity', '研究・業績'), ('blog', 'ブログ')] %}
                <a href="{{ url_for(key) }}"{% if page == key %} aria-current="page"{% endif %}>{{ label }}</a>
                {% endfor %}
            </nav>
        </header>
        {% block band %}{% endblock %}
    </div>

    <main class="page-wrap wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>&copy; {{ this_year }} {{ profile.name_en }}</p>
        </div>
    </footer>
</body>
</html>

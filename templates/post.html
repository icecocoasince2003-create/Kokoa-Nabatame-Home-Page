{% extends "base.html" %}

{% block title %}{{ post.title }} | {% endblock %}

{% block content %}
        <article>
            <p class="post-meta">{{ post.date|ymd }}{% if post.place %}　{{ post.place }}{% endif %}</p>
            <h1 class="post-title">{{ post.title }}</h1>

            <div class="post-body">
                {{ post.html|safe }}
                {% if post.url %}<p>関連リンク：<a href="{{ post.url }}">{{ post.url }}</a></p>{% endif %}
            </div>
        </article>

        <p class="back"><a href="{{ url_for('blog') }}">ブログの一覧に戻る</a></p>
{% endblock %}

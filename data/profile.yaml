affiliation: 筑波大学大学院 人文社会科学研究群 言語学サブプログラム 博士前期課程2年

# トップページ：自己紹介（空行で段落が分かれます）
about: |
  筑波大学大学院で言語学（エジプト語・コプト語）を専攻しています。研究対象はコプト語サイード方言、ナグ・ハマディ写本、『ユダ福音書』、そしてデジタル・ヒューマニティーズです。

  古代エジプト語・コプト語の文献研究やグノーシス主義などの宗教思想に加え、テキスト資源のデジタル化やコーパス化にも関心があります。

# トップページ「現在の関心」
interests:
  - コプト語サイード方言の統語・意味論研究
  - ナグ・ハマディ写本のデジタル資源化
  - 『ユダ福音書』を中心としたグノーシス主義研究
  - 機械学習を活用した古典語コーパス開発

# 研究と活動ページ「研究テーマ」
themes:
  - title: コプト語サイード方言の示差的目的語標示（DOM）
    text: ナグ・ハマディ写本や『ユダ福音書』を対象に、目的語標示の傾向と統語・意味論的条件を分析しています。
  - title: ナグ・ハマディ写本 全文公開コーパスの開発
    text: 機械学習やマークアップを活用し、古典語資料を再利用しやすい研究基盤へ整備することを目指しています。
  - title: グノーシス主義文書研究
    text: 『ユダ福音書』や関連文書を通して、思想史・文献学・言語学を横断的に扱っています。

